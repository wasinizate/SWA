<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Strict CSP: only same-origin (local file) scripts/styles may run, and
    inline <script> tags are blocked entirely. img-src additionally allows
    blob: for attachment thumbnails/lightbox, which are rendered from
    in-memory Blob objects (see views/orderDetail.js and views/expenses.js,
    both via renderer/attachmentGrid.js) rather than fetched from anywhere
    -- still fully local, never a network request.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  <title>SWA</title>
  <!--
    FullCalendar v7 ships its CSS as explicit files rather than injecting
    them via JS -- skeleton.css (structural) + the "classic" theme's own
    theme.css (structural) + palette.css (actual colors, including a
    built-in dark palette calendar.js opts into). See
    scripts/copy-vendor-assets.js for where these come from.
  -->
  <link rel="stylesheet" href="vendor/fullcalendar/skeleton.css" />
  <link rel="stylesheet" href="vendor/fullcalendar/theme-classic.css" />
  <link rel="stylesheet" href="vendor/fullcalendar/theme-classic-palette.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app"></div>
  <!--
    FullCalendar's scripts aren't loaded here -- the Calendar page loads
    them on first open (see fullCalendarLoader.js), so app startup doesn't
    pay to parse a bundle only one page uses.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
