# Packaging config for electron-builder. Targets for all three desktop
# platforms are defined here (per the project's cross-platform goal);
# Windows is built/tested locally, macOS is built by
# .github/workflows/build-macos.yml on GitHub's own macOS runners -- see
# README.md's Cross-platform status section.
#
# electron-builder auto-detects "building from a CI-tagged commit" and
# will otherwise try to publish to GitHub itself using its own built-in
# publish support -- package.json's "package" script passes
# `--publish never` to disable that, since build-macos.yml's own
# `gh release upload` step is what actually publishes the build. Leave
# that flag in place; without it, `npm run package` fails on a tagged
# commit in CI with "GitHub Personal Access Token is not set."
appId: com.wasinizate.swa
productName: SWA
directories:
  output: dist
files:
  - src/**/*
  - package.json
  - node_modules/**/*
# better-sqlite3-multiple-ciphers ships a native .node binary. Native
# modules can't be loaded from inside an asar archive, so this unpacks
# just that file into app.asar.unpacked/ at build time.
asarUnpack:
  - "**/*.node"
win:
  target: nsis
mac:
  # Explicit arch list -- GitHub's macos-latest runners are Apple
  # Silicon, so without this only an arm64 build would come out, leaving
  # Intel Mac users with nothing. Two separate .dmg files (not a single
  # "universal2" one) since better-sqlite3-multiple-ciphers' native
  # binary has to be built per-architecture anyway.
  #
  # artifactName is explicit because electron-builder's own default
  # omits the arch suffix for x64 specifically (a backwards-compat quirk
  # from when x64 was the only Mac arch) while still appending "-arm64"
  # for the other -- v0.2.2 shipped as the ambiguous "SWA-0.2.2.dmg"
  # (x64) next to "SWA-0.2.2-arm64.dmg", which is exactly the kind of
  # "which one do I download" confusion that caused a real install
  # failure (an Apple Silicon Mac almost certainly grabbed the unlabeled
  # x64 build). Every artifact name below always includes ${arch}.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
